run_name: warmup_glue_warmup_sst2_final
seed: 42
total_outer_steps: 3000
eval_every: 75
log_gradients_every: 75
checkpoint_every: 500
checkpoint_interval_minutes: 10.0
resume: false
output_dir: outputs/lr_warmup_glue/final
results_dir: results/lr_warmup_glue
plots_dir: plots/lr_warmup_glue
deterministic: false
distributed:
  mode: centralized
  num_nodes: 1
  local_steps: 1
  data_distribution: iid
  participation_rate: 1.0
  partition_file: null
data:
  dataset_name: glue
  task_type: classification
  split_train: train
  split_val: validation
  split_test: test
  tokenizer_name: roberta-base
  max_seq_len: 128
  batch_size: 32
  num_workers: 0
  glue_task: sst2
  src_lang: null
  tgt_lang: null
model:
  kind: hf_seq_cls
  in_features: 10
  hidden_size: 64
  pretrained_name: roberta-base
  arch_name: ''
  pretrained: false
  num_classes: 2
  custom_factory: null
inner_optimizer:
  name: sgd
  lr: 2.51189e-05
  clipping:
    clip_type: upper
    clip_scope: global
    upper: 0.05
    lower: 0.0
    layer_overrides: {}
    dynamic: false
    dynamic_percentile: 0.9
    dynamic_ema_decay: 0.99
    quantile_level: 0.9
    quantile_lr: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  weight_decay: 0.0
  custom_factory: null
  warmup_steps: 50
  warmup_max_lr: null
  warmup_schedule: linear
outer_optimizer:
  name: average
  lr: 1.0
  clipping:
    clip_type: none
    clip_scope: global
    upper: 1.0
    lower: 0.0
    layer_overrides: {}
    dynamic: false
    dynamic_percentile: 0.9
    dynamic_ema_decay: 0.99
    quantile_level: 0.9
    quantile_lr: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  weight_decay: 0.0
  custom_factory: null
  warmup_steps: 0
  warmup_max_lr: null
  warmup_schedule: linear
metrics:
- loss
- accuracy
device: cuda
