# Sweep for warmup condition, heavy-tail (Student-t df=2) noise, normalized
# gradient (clip_type=biclip, upper=lower=1.0 fixed in the base config).
# Independently finds the best lr and warmup duration; no clip-threshold
# axis under normalization, since ||g|| is forced to exactly 1 regardless of
# threshold (cheaper grid than the raw/clipped-gradient warmup sweeps).
base_config: experiments/normalized_grad_warmup_benefit/configs/warmup_heavy_tail.yaml
parallel_jobs: 8
primary_metric: best_val_loss
lower_is_better: true

stage1:
  search: grid
  axes:
    - field: inner_optimizer.lr
      values: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
      log_scale: true
    - field: inner_optimizer.warmup_steps
      values: [20, 50, 100, 200, 500]

stage2:
  search: grid
  n_values: 4
  zoom_factor: 0.4
  axes:
    - field: inner_optimizer.lr
      log_scale: true
    - field: inner_optimizer.warmup_steps
